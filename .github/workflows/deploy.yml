name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one Pages deploy finish before the next starts; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the shared specs. Zero dependencies — the runner loads the classic
  # scripts and runs the same checks the in-browser test pages do.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node tests/run.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # No build step — ship the static directory as-is.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
